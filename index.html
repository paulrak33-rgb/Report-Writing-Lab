<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professional Report Writing Lab</title><style>
:root{font-family:system-ui,Arial;color:#203047;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}header{background:#16385c;color:white;padding:25px max(20px,calc((100vw - 1050px)/2))}header h1{margin:0 0 5px}main{max-width:1050px;margin:24px auto;padding:0 16px 50px}.card{background:white;border:1px solid #dce5ee;border-radius:15px;padding:22px;margin:16px 0;box-shadow:0 2px 8px #1232}.tabs,.steps{display:flex;flex-wrap:wrap;gap:8px}button{border:1px solid #b9cbdb;background:#fff;color:#183e62;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:600}button:hover{background:#eaf3fc}button.active,.primary{background:#1769a8;color:white;border-color:#1769a8}button:disabled{opacity:.55;cursor:default}.muted{color:#52667c}.small{font-size:.89rem}.chartbox{margin:12px 0 25px}.chartbox h3{margin:0 0 8px}.bars{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:minmax(120px,200px) 1fr 55px;align-items:center;gap:10px}.track{background:#e7eef5;height:24px;border-radius:5px;overflow:hidden}.fill{height:100%;width:0;background:#2583bd;border-radius:5px;transition:width 4.5s ease}.fill.alt{background:#ed9b45}.piearea{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.pie{height:240px;width:240px;border-radius:50%;background:conic-gradient(#2677ad 0 40%,#e49a46 40% 70%,#4caa8a 70% 90%,#8d76bd 90% 100%);transform:scale(0);transition:transform 4.5s ease}.pie.show{transform:scale(1)}.piewrap{position:relative;width:240px;height:240px}.pielabel{position:absolute;color:white;font-weight:800;text-shadow:0 1px 3px #243344;pointer-events:none;transform:translate(-50%,-50%)}@media(max-width:600px){.piewrap{width:190px;height:190px}}.legend{display:grid;gap:10px}.swatch{display:inline-block;width:12px;height:12px;margin-right:8px;border-radius:2px}.q{border-top:1px solid #e5ebf1;padding:14px 0}.q:first-child{border-top:0}.choices{display:grid;gap:7px;margin-top:10px}.choice{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #e2e9f0;border-radius:8px;cursor:pointer}.choice:has(input:checked){border-color:#3e8bc4;background:#eef7ff}input[type=text],textarea{border:1px solid #b9cadb;border-radius:8px;padding:10px;font:inherit;width:100%}textarea{min-height:135px;resize:vertical}.correct{color:#16724c}.wrong{color:#ae3434}.feedback{margin-top:7px;font-size:.9rem}.panel{background:#edf5fc;padding:14px;border-radius:10px;margin:10px 0}.section{margin:18px 0}.hidden{display:none}.status{font-weight:700;margin-top:12px}.hint{padding:12px;background:#fff8e9;border-left:4px solid #e6a545;margin:10px 0}footer{color:#60738a;text-align:center;padding:20px}label{font-weight:600}details{margin:10px 0}summary{cursor:pointer;font-weight:600} @media(max-width:600px){.barrow{grid-template-columns:105px 1fr 40px;font-size:.8rem}.pie{width:190px;height:190px}}
.task-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}.task-heading h2{margin:0}.reset-button{background:#fff5f3;color:#a12b22;border:1px solid #e6aaa3;font-weight:650;white-space:nowrap}.reset-button:hover{background:#ffe9e5}@media(max-width:600px){.task-heading{align-items:flex-start}.reset-button{margin-left:auto}}
</style><style>.drag-list{display:grid;gap:10px}.drag-tile{display:flex;align-items:center;gap:10px;padding:12px;background:#f7faff;border:1px solid #b9cbdb;border-radius:9px;cursor:grab}.drag-copy{flex:1}.drag-controls{display:flex;gap:5px}.drag-controls button{padding:6px 10px}.drag-num{font-weight:700;color:#1769a8}.drag-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:15px}.drag-zone{border:2px dashed #b9cbdb;border-radius:10px;padding:12px;min-height:110px}.drag-zone h3{font-size:1rem;margin-top:0}.drag-zone .drag-tile{margin:8px 0}.drag-bank{margin:16px 0}.drag-bank .drag-tile{margin:8px 0}.drag-tile select{max-width:130px;padding:7px}@media(max-width:700px){.drag-columns{grid-template-columns:1fr}.drag-tile{flex-wrap:wrap}.drag-controls{margin-left:auto}}</style></head><body><header><h1>Professional Report Writing Lab</h1><div>Four interactive self-study modules · Animated data · Guided practice · Independent writing</div></header><main><div class="card"><div class="task-heading"><h2>Choose a practice task</h2><button type="button" onclick="resetProgress()" class="reset-button">↻ Reset My Progress</button></div><div id="modules" class="tabs"></div><p id="scenario" class="muted"></p><div class="steps" id="steps"></div></div><div id="content"></div></main><footer>Practice data are fictional. Your drafts are saved in this browser only.</footer><script>
const D=[
{id:'caf',type:'Problem-Solving',name:'Improving the Campus Cafeteria',requester:'Student Services Department',scenario:'Investigate student complaints about the campus cafeteria and recommend practical improvements.',title:'A Problem-Solving Report to Investigate Problems with the Campus Cafeteria and Recommend Practical Improvements Based on Data Collected from a Student Survey',bars:[['Long queues',80],['High prices',55],['Limited healthy options',35],['Food quality',20],['Cleanliness',10]],pie:[['Faster service',40],['Lower prices',30],['Healthier meals',20],['Better seating',10]],unit:'students',barTitle:'Main cafeteria complaints',pieTitle:'Preferred improvements',focus:'long queues',solution:'introduce an additional serving counter',second:'offer lower-priced meal deals'},
{id:'study',type:'Evaluation',name:'Comparing Campus Study Spaces',requester:'Student Services Department',scenario:'Compare the College Library and Student Centre as study locations and recommend the better option.',title:'An Evaluation Report to Compare the College Library and Student Centre as Possible Study Locations Based on Data Collected from a Student Survey',groups:[['Quiet environment',90,55],['Comfortable seating',65,85],['Wi-Fi quality',80,75],['Available space',60,90]],groupNames:['Library','Student Centre'],pie:[['Quiet environment',40],['Comfortable seating',25],['Wi-Fi quality',20],['Available space',15]],unit:'%',barTitle:'Positive ratings by study space (%)',pieTitle:'Most important study-space feature',focus:'quietness',solution:'prioritise the library for quiet study',second:'improve seating availability'},
{id:'park',type:'Problem-Solving',name:'Reducing Campus Parking Problems',requester:'Campus Facilities Department',scenario:'Investigate difficulties with campus parking and recommend practical improvements.',title:'A Problem-Solving Report to Investigate Campus Parking Difficulties and Recommend Improvements Based on Data from a Student Survey',bars:[['Not enough spaces',85],['Long search times',55],['Poor signage',30],['Unsafe crossings',20],['Other',10]],pie:[['More parking spaces',45],['Shuttle service',25],['Better signage',20],['Safer crossings',10]],unit:'students',barTitle:'Main parking complaints',pieTitle:'Preferred parking improvements',focus:'insufficient parking spaces',solution:'increase parking capacity',second:'introduce a peak-hour shuttle service'},
{id:'furniture',type:'Evaluation',name:'Choosing Student Lounge Furniture',requester:'College Facilities Department',scenario:'Evaluate two furniture packages for a new student lounge. The total budget is AED 25,000. Supplier A costs AED 19,500 and Supplier B costs AED 24,000. Recommend the better value.',title:'An Evaluation Report to Compare Two Student Lounge Furniture Packages and Recommend the Best Value Based on Survey Ratings and a Budget of AED 25,000',groups:[['Comfort',70,92],['Appearance',75,90],['Durability',65,88]],groupNames:['Supplier A','Supplier B'],pie:[['Comfort',40],['Durability',30],['Appearance',20],['Price',10]],unit:'%',barTitle:'Positive ratings by supplier (%)',pieTitle:'Most important furniture criteria',budget:true,focus:'comfort and durability',solution:'select Supplier B if the improved ratings justify its cost',second:'consider Supplier A if retaining more funds is the priority'}];
const contexts={
 caf:'Ms Aisha Al Mansoori, Head of Student Services, has received repeated complaints about the campus cafeteria during the lunchtime rush. She has asked you to prepare a report for the Student Services Department. A survey of 200 students recorded their main complaint and preferred improvement. Examine both charts, identify the most serious problems, and recommend two realistic actions supported by the findings.',
 study:'Mr Omar Hassan, Director of Student Experience, is considering where to establish an additional student study area. He has requested a report for the Student Services Department comparing the College Library and the Student Centre. Student survey ratings cover quietness, seating, Wi-Fi and available space; a second chart shows which features matter most. Weigh the strengths and weaknesses of both locations before recommending one.',
 park:'Ms Fatima Al Nuaimi, Campus Facilities Manager, has been asked to respond to growing student complaints about parking before the next semester. She has commissioned a report for the Campus Facilities Department. A survey of 200 students records the main difficulties and preferred improvements. Use both charts to prioritise the problems and propose two achievable measures, explaining why they should help.',
 furniture:'Mr Khalid Al Marri, Procurement and Facilities Manager, must recommend a furniture supplier for a new student lounge. He has requested a report for the College Facilities Department. The approved budget is AED 25,000. Supplier A costs AED 19,500 and Supplier B costs AED 24,000. Survey ratings compare comfort, appearance and durability, while a second chart identifies student priorities. Evaluate quality and value for money, calculate the remaining budget for each option, and recommend a supplier with reasons.'
};
const colors=['#2677ad','#e49a46','#4caa8a','#8d76bd'];let mod=0,step=0;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=(s)=>`reportlab_${D[mod].id}_${s}`;const get=(s,def='')=>{try{return JSON.parse(localStorage.getItem(key(s)))??def}catch{return def}};const save=(s,v)=>localStorage.setItem(key(s),JSON.stringify(v));const steps=['Study the Graphs','Comprehension','Vocabulary','Improve sentences','Findings or analysis?','Select missing words','Type missing words','Write your report'];
function resetProgress(){
 const choice=confirm('Reset all four modules?\n\nThis will permanently clear saved exercise answers and report drafts from this browser for this website. This cannot be undone.');
 if(!choice)return;
 const keys=[];
 for(let i=0;i<localStorage.length;i++){
  const k=localStorage.key(i);
  if(k && k.startsWith('reportlab_'))keys.push(k);
 }
 keys.forEach(k=>localStorage.removeItem(k));
 mod=0;step=0;init();
 alert('Progress reset. All four modules are ready for a fresh demonstration.');
}
function init(){ $('modules').innerHTML=D.map((d,i)=>`<button class="${i===mod?'active':''}" onclick="mod=${i};step=0;init()">${i+1}. ${esc(d.name)}</button>`).join('');$('scenario').innerHTML=`<strong>The Scenario</strong><br>${esc(contexts[D[mod].id])}`;$('steps').innerHTML=steps.map((s,i)=>`<button class="${step===i?'active':''}" onclick="step=${i};init()">${i+1}. ${s}</button>`).join('');render()}
function chartHtml(){let d=D[mod],bars=d.groups?d.groups.flatMap(x=>[[x[0]+' — '+d.groupNames[0],x[1],0],[x[0]+' — '+d.groupNames[1],x[2],1]]):d.bars.map(x=>[...x,0]);let max=d.groups?100:Math.max(...d.bars.map(x=>x[1]));let rows=bars.map(([n,v,a])=>`<div class="barrow"><span>${esc(n)}</span><div class="track"><div class="fill ${a?'alt':''}" data-width="${v/max*100}%"></div></div><b>${v}${d.groups?'%':''}</b></div>`).join('');let start=0,segments=d.pie.map(([n,v],i)=>{let t=`${colors[i]} ${start}% ${start+v}%`;start+=v;return t}).join(',');let center=0;let labels=d.pie.map(([n,v])=>{let angle=(center+v/2)*Math.PI/50-Math.PI/2;center+=v;return `<span class="pielabel" style="left:${50+31*Math.cos(angle)}%;top:${50+31*Math.sin(angle)}%">${v}%</span>`}).join('');return `<div class="chartbox"><h3>${esc(d.barTitle)}</h3><div class="bars">${rows}</div></div><div class="chartbox"><h3>${esc(d.pieTitle)}</h3><div class="piearea"><div class="piewrap"><div class="pie" style="background:conic-gradient(${segments})" aria-label="Pie chart; percentages are also given in the legend"></div>${labels}</div><div class="legend">${d.pie.map(([n,v],i)=>`<div><span class="swatch" style="background:${colors[i]}"></span>${esc(n)}: <b>${v}%</b></div>`).join('')}</div></div></div>`}
function replayCharts(){
 document.querySelectorAll('.fill').forEach(x=>{x.style.transition='none';x.style.width='0px'});
 document.querySelectorAll('.pie').forEach(p=>{p.style.transition='none';p.style.transform='scale(0)'});
 void document.body.offsetHeight;
 document.querySelectorAll('.fill').forEach(x=>{x.style.transition='width 5s ease-in-out';x.style.width=x.dataset.width});
 document.querySelectorAll('.pie').forEach(p=>{p.style.transition='transform 5s ease-in-out';p.style.transform='scale(1)'});
}

function qData(){let d=D[mod],top=d.groups?d.groups[0][0]:d.bars[0][0],pie=d.pie;let q=[['Which topic is being investigated?',d.name,['A different campus issue','A national transport policy']],['Which improvement or feature has the largest share in the pie chart?',pie[0][0],[pie[1][0],pie[2][0]]],['What percentage selected '+pie[0][0]+'?',pie[0][1]+'%',[pie[1][1]+'%',pie[2][1]+'%']],['Which feature has the smallest share?',pie[3][0],[pie[0][0],pie[1][0]]],['Which type of report is most appropriate for this brief?',d.type,['Informative',d.type==='Evaluation'?'Problem-Solving':'Evaluation']],['Who requested the report?',d.requester,['A local newspaper','A private customer']],['What should a conclusion include?','A brief summary and justified recommendations',['Only repeated chart figures','New survey results']],['Which is most appropriate for professional reporting?','Accurate figures and neutral language',['Strong personal feelings','Unverified claims']]];if(d.groups){q.splice(1,0,['Which option scores higher on '+d.groups[0][0]+'?',d.groupNames[d.groups[0][1]>d.groups[0][2]?0:1],[d.groupNames[d.groups[0][1]>d.groups[0][2]?1:0],'Both are equal']]);q.push(['Which option scores higher on '+d.groups[1][0]+'?',d.groupNames[d.groups[1][1]>d.groups[1][2]?0:1],[d.groupNames[d.groups[1][1]>d.groups[1][2]?1:0],'Both are equal']])}else{q.splice(1,0,['What is the most common complaint?',top,[d.bars[1][0],d.bars[2][0]]]);q.push(['How many students reported '+d.bars[0][0]+'?',String(d.bars[0][1]),[String(d.bars[1][1]),String(d.bars[2][1])]])}if(d.budget){q.push(['How much remains if Supplier A is chosen?','AED 5,500',['AED 1,000','AED 4,500']]);q.push(['How much more does Supplier B cost?','AED 4,500',['AED 5,500','AED 1,000']])}return q}
function vocab(){return [['The main _____ of this report is to investigate the issue.','purpose',['weather','picture']],['The results _____ that improvements are necessary.','suggest',['speak','command']],['The data were _____ from a student survey.','collected',['invented','purchased']],['The report makes two practical _____.','recommendations',['conversations','celebrations']],['A significant _____ was identified in the survey.','problem',['decoration','invitation']],['The chart _____ the survey findings.','illustrates',['argues','orders']],['The Student Services Department should _____ the available options.','evaluate',['entertain','forget']],['The recommendation should be supported by _____.','evidence',['opinions only','guesses']]]}
function sentences(){let d=D[mod],n=d.pie[0][1],label=d.pie[0][0].toLowerCase(),who=d.requester;
 return [
 ['Which sentence most precisely describes the purpose and requester?',`The ${who} requested this report to ${d.type==='Evaluation'?'compare the options and recommend the most suitable choice':'investigate the reported difficulties and recommend practical solutions'}.`,[`The report was requested by the department to consider the situation and provide information.`,`This report was requested by ${who} and it will be about different matters affecting students.`]],
 ['Which sentence correctly distinguishes a survey finding from an interpretation?',`The chart records ${n}% for ${label}; this suggests that the issue deserves particular attention.`,[`The chart proves that ${n}% of all college students are dissatisfied with ${label}.`,`The chart suggests ${n}% of students and therefore the issue has definitely been solved.`]],
 ['Which sentence uses accurate and cautious analytical language?',`The results may indicate that ${label} is a priority for the surveyed students.`,[`The results demonstrate that ${label} is the only priority for every student.`,`The results are indicating that ${label} must certainly be the most serious problem on campus.`]],
 ['Which sentence reports a comparison with correct grammar?',`The first category received a higher rating than the second category.`,[`The first category received a higher rating compared the second category.`,`The first category was rated more higher than the second category.`]],
 ['Which recommendation is specific and appropriately justified?',`It is recommended that the ${who} review the leading concern first, as it received the strongest response in the survey.`,[`It is recommended to the department to make the necessary changes because there are some problems.`,`The department should improve everything immediately because the chart shows that students have opinions.`]],
 ['Which conclusion avoids adding unsupported information?',`Overall, the survey identifies clear priorities, although further information may be needed before implementation.`,[`Overall, the survey proves that the recommended changes will increase student satisfaction by 50%.`,`Overall, every student supports the recommendations, so no further consultation is necessary.`]]
 ]}

function classify(){return [['The chart shows that 40% selected the first option.','Finding',['Analysis','Recommendation']],['This may indicate that students value convenience.','Analysis',['Finding','Recommendation']],['The college should introduce a practical improvement.','Recommendation',['Finding','Analysis']],['The second category received fewer responses than the first.','Finding',['Analysis','Recommendation']],['These results suggest that the current arrangements may be insufficient.','Analysis',['Finding','Recommendation']]]}
function selectGaps(){let d=D[mod],who=d.requester;return [
 [`The report was _____ by the ${who} to investigate the issue and recommend improvements.`,'requested',['reviewed','submitted']],
 ['The _____ of the report is to examine the evidence.','purpose',['subject','finding']],
 ['The survey _____ indicate a clear concern.','results',['responses','questions'],['results','responses']],
 ['According _____ the chart, one category is highest.','to',['with','from']],
 ['The figures _____ that further improvements may be necessary.','suggest',['guarantee','prove'],['suggest']],
 ['Two recommendations are _____ in the final section to address the main concerns.','provided',['identified','evaluated'],['provided','identified']]
]}
// Each module uses the same language objectives with examples grounded in its own scenario.
function typedQuestions(){
 const d=D[mod], evaluation=d.type==='Evaluation';
 const data={
 caf:{subject:'lunchtime queues and food prices in the campus cafeteria',chart:'The bar chart _____ the number of complaints received about different aspects of the campus cafeteria.',issue:'long queues',action:'introduce an additional serving counter'},
 study:{subject:'the suitability of the College Library and Student Centre for independent study',chart:'The grouped bar chart _____ student ratings for the College Library and Student Centre across four study-space features.',issue:'quiet study areas',action:'improve seating availability in the selected study space'},
 park:{subject:'the shortage of parking spaces and delays in finding a place to park on campus',chart:'The bar chart _____ the number of student complaints about different campus parking difficulties.',issue:'parking spaces',action:'introduce a peak-hour shuttle service'},
 furniture:{subject:'the comfort, durability and cost of two furniture packages for the new student lounge',chart:'The grouped bar chart _____ the positive student ratings for Supplier A and Supplier B on comfort, appearance and durability.',issue:'furniture quality',action:'compare the suppliers’ ratings with the available budget'}
 }[d.id];
 return [
 [`The report was _____ by the ${d.requester} to examine ${data.subject}.`,['requested','commissioned','assigned']],
 [`The main _____ of the report is to ${evaluation?'evaluate the available options and recommend a suitable choice':'investigate the reported difficulties and recommend practical improvements'}.`,['purpose','aim','objective','goal']],
 [`The data used in the report were _____ from a survey of students about ${data.issue}.`,['collected','gathered','obtained']],
 [`According _____ the ${d.groups?'grouped bar chart':'bar chart'}, ${d.groups?'the two options received different ratings':'some problems received more complaints than others'}.`,['to']],
 [`The survey findings _____ that ${evaluation?'student priorities should influence the final choice':'the department may need to address the most common concerns first'}.`,['suggest','indicate','show']],
 [data.chart,['shows','illustrates','presents','displays']],
 [`The report identifies the main _____ affecting ${evaluation?'the decision between the two options':'students in the campus survey'}.`,['issues','factors','concerns']],
 [`Before making a recommendation, it is important to _____ the results from both charts carefully.`,['analyse','analyze','examine','evaluate','review','compare']],
 [`The ${d.requester} should _____ a practical plan to ${data.action}.`,['develop','prepare','create','propose']],
 [`The final section should include two _____ supported by the survey evidence.`,['recommendations','suggestions','proposals']]
 ];
}

function makeMCQ(items,tag){let old=get(tag,{});$('content').innerHTML=`<div class="card"><h2>${steps[step]}</h2><p class="muted">Answer the questions first. Feedback appears only when you click Check My Answers.</p>${tag==='comp'?`<div class="reference-charts"><h3>Survey charts — refer to these as you answer</h3>${chartHtml()}<button type="button" onclick="replayCharts()">Replay graph animations</button></div>`:''}<div id="qs">${items.map(([question,correct,wrong],i)=>{let options=[...new Set([correct,...wrong])].sort((a,b)=>((a.length*7+i*3)%11)-((b.length*7+i*3)%11));return `<div class="q"><b>${i+1}. ${esc(question)}</b><div class="choices">${options.map((o,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${esc(o)}" ${old[i]===o?'checked':''} onchange="updateChoice('${tag}',${i},this.value)">${esc(o)}</label>`).join('')}</div><div class="feedback" id="fb${i}"></div></div>`}).join('')}</div><button class="primary" onclick="checkMCQ('${tag}')">Check My Answers</button> <button onclick="resetMCQ('${tag}')">Clear answers</button><div id="score" class="status" aria-live="polite"></div></div>`;if(tag==='comp')replayCharts()}
function updateChoice(tag,i,val){let a=get(tag,{});a[i]=val;save(tag,a);$('score').textContent='';document.querySelectorAll('.feedback').forEach(x=>x.textContent='')}
function checkMCQ(tag){let items=tag==='comp'?qData():tag==='vocab'?vocab():tag==='sent'?sentences():tag==='class'?classify():selectGaps(),a=get(tag,{}),score=0;items.forEach((x,i)=>{let accepted=x[3]||[x[1]],ok=accepted.includes(a[i]);if(ok)score++;$('fb'+i).innerHTML=a[i]?(ok?'<span class="correct">Correct.</span>':`<span class="wrong">Not quite. Accepted answers: ${esc(accepted.join(' / '))}.</span>`):'<span class="wrong">Not answered.</span>'});$('score').textContent=`Score: ${score}/${items.length}. ${items.length-Object.keys(a).length>0?items.length-Object.keys(a).length+' unanswered.':''}`}
function resetMCQ(tag){save(tag,{});render()}
function makeTyped(){let a=get('typed',{}),items=typedQuestions();$('content').innerHTML=`<div class="card"><h2>Type the missing words</h2><p class="muted">Some questions have several acceptable answers. Complete the exercise before checking.</p>${items.map(([q,ans],i)=>`<div class="q"><label for="t${i}">${i+1}. ${esc(q)}</label><input id="t${i}" type="text" value="${esc(a[i]||'')}" oninput="typeUpdate(${i},this.value)" placeholder="Missing word or phrase"><button type="button" class="small" onclick="firstLetter(${i})">Hint: first letter</button><span id="letter${i}" class="muted small" aria-live="polite"></span><div class="feedback" id="fb${i}"></div></div>`).join('')}<button class="primary" onclick="checkTyped()">Check My Answers</button><div id="score" class="status" aria-live="polite"></div></div>`}
function firstLetter(i){const letters=[...new Set(typedQuestions()[i][1].map(answer=>answer.trim()[0].toUpperCase()))];$('letter'+i).textContent=' First letters: '+letters.join(' / ')}
function typeUpdate(i,v){let a=get('typed',{});a[i]=v;save('typed',a);$('score').textContent='';document.querySelectorAll('.feedback').forEach(x=>x.textContent='')}
function checkTyped(){let a=get('typed',{}),items=typedQuestions(),score=0;items.forEach(([q,answers],i)=>{let val=(a[i]||'').trim().toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' '),ok=answers.includes(val);if(ok)score++;$('fb'+i).innerHTML=val?(ok?`<span class="correct">Correct. Accepted: ${esc(answers.join(' / '))}.</span>`:`<span class="wrong">Check your answer. Possible answers: ${esc(answers.join(' / '))}.</span>`):'<span class="wrong">Not answered.</span>'});$('score').textContent=`Score: ${score}/${items.length}.`}

erCase()}, with ${d.groups[1][2]}% compared with ${d.groups[1][1]}%. This means that neither option is stronger in every category.\n\nThe second chart indicates that ${d.pie[0][0].toLowerCase()} is the most important factor for ${d.pie[0][1]}% of respondents. ${d.pie[1][0]} follows at ${d.pie[1][1]}%. These priorities should influence the final decision.${d.budget?' Supplier A would leave AED 5,500 of the AED 25,000 budget, while Supplier B would leave AED 1,000. The premium option costs AED 4,500 more, so its stronger ratings must be weighed against the smaller remaining budget.':''}\n\nOverall, the choice depends on the importance given to quality, suitability and${d.budget?' cost':' student preferences'}. It is recommended that the ${d.requester} ${d.solution}. The ${d.requester} should also ${d.second}, because this would help ensure that the selected option meets student needs.`;$('model').classList.remove('hidden');$('model').innerHTML='<h3>Model answer for comparison</h3><p class="small">Compare the organisation, evidence and reasoning with your own work. This is one possible response, not the only correct answer.</p><p><b>'+esc(d.title)+'</b></p>'+text.split('\n\n').map(x=>'<p>'+esc(x)+'</p>').join('')}

const dragLabels=['Put the report in order','Sort the statements','Build professional sentences'];
steps.splice(4,1); // Replace the old multiple-choice classification exercise.
steps.splice(6,0,...dragLabels);
const baseRender=render;
render=function(){if(step>=6&&step<=8){renderDrag(step-6)}else if(step===9){writing()}else if(step===4||step===5){const current=step;step=current+1;baseRender();step=current;}else{baseRender()}};
function dragItems(kind){const d=dragData[D[mod].id];if(kind===0)return d.order.map((v,i)=>({id:i,text:v}));if(kind===1)return d.sort.map(([v,c],i)=>({id:i,text:v,category:c}));return d.build.map(([full,chunks],i)=>({full,chunks,id:i}))}
function dragState(kind){const k='drag'+kind;let v=get(k,null);const items=dragItems(kind);if(kind===0){if(!Array.isArray(v)||v.length!==items.length||new Set(v).size!==items.length)v=[2,0,4,1,5,3];}else if(kind===1){if(!v||typeof v!=='object'||Array.isArray(v))v={};}else{if(!Array.isArray(v)||v.length!==items.length)v=items.map(x=>x.chunks.map((_,i)=>i).reverse());}return v}
function dragSave(kind,v){save('drag'+kind,v);const el=$('drag-feedback');if(el)el.textContent=''}
let pickedTile=null;
function renderDrag(kind){pickedTile=null;const items=dragItems(kind),state=dragState(kind);let html=`<div class="card"><h2>${dragLabels[kind]}</h2><p class="muted">${kind===0?'Arrange the six sentences in the order they should appear in a report.':kind===1?'Place each statement under Finding, Analysis or Recommendation.':'Put the word groups in the correct order to form a professional sentence.'} Drag the cards, or use the buttons to move them. Click Check My Answers when finished.</p>`;
 if(kind===0){html+='<div id="drag-order" class="drag-list">'+state.map((id,pos)=>`<div class="drag-tile" draggable="true" ondragstart="tileStart(event,0,${pos})" ondragover="event.preventDefault()" ondrop="tileDrop(event,0,${pos})"><span class="drag-num">${pos+1}.</span><span class="drag-copy">${esc(items[id].text)}</span><span class="drag-controls"><button type="button" ${pos===0?'disabled':''} onclick="moveOrder(${pos},-1)" aria-label="Move sentence up">↑</button><button type="button" ${pos===state.length-1?'disabled':''} onclick="moveOrder(${pos},1)" aria-label="Move sentence down">↓</button></span></div>`).join('')+'</div>'}
 else if(kind===1){const cats=['Finding','Analysis','Recommendation'];html+='<div class="drag-bank"><h3>Statements</h3>'+items.filter(x=>!state[x.id]).map(x=>`<div class="drag-tile" draggable="true" ondragstart="tileStart(event,1,${x.id})"><span class="drag-copy">${esc(x.text)}</span><span class="drag-controls"><select aria-label="Choose category" onchange="setCategory(${x.id},this.value)"><option value="">Move to…</option>${cats.map(c=>`<option>${c}</option>`).join('')}</select></span></div>`).join('')+'</div><div class="drag-columns">'+cats.map(c=>`<div class="drag-zone" ondragover="event.preventDefault()" ondrop="categoryDrop(event,'${c}')"><h3>${c}</h3>${items.filter(x=>state[x.id]===c).map(x=>`<div class="drag-tile" draggable="true" ondragstart="tileStart(event,1,${x.id})"><span class="drag-copy">${esc(x.text)}</span><button type="button" onclick="setCategory(${x.id},'')" aria-label="Return to statements">↩</button></div>`).join('')||'<p class="muted small">Drop a statement here</p>'}</div>`).join('')+'</div>'}
 else {html+=items.map((it,si)=>`<div class="section"><h3>Sentence ${si+1}</h3><div class="drag-list">${state[si].map((id,pos)=>`<div class="drag-tile" draggable="true" ondragstart="tileStart(event,2,${si},${pos})" ondragover="event.preventDefault()" ondrop="tileDrop(event,2,${si},${pos})"><span class="drag-copy">${esc(it.chunks[id])}</span><span class="drag-controls"><button type="button" ${pos===0?'disabled':''} onclick="moveChunk(${si},${pos},-1)" aria-label="Move word group left">←</button><button type="button" ${pos===state[si].length-1?'disabled':''} onclick="moveChunk(${si},${pos},1)" aria-label="Move word group right">→</button></span></div>`).join('')}</div></div>`).join('')}
 html+=`<p><button class="primary" type="button" onclick="checkDrag(${kind})">Check My Answers</button> <button type="button" onclick="resetDrag(${kind})">Try again</button></p><div id="drag-feedback" class="status" aria-live="polite"></div></div>`;$('content').innerHTML=html}
function swap(a,i,j){const v=a.slice();[v[i],v[j]]=[v[j],v[i]];return v}
function moveOrder(i,delta){const s=dragState(0);dragSave(0,swap(s,i,i+delta));renderDrag(0)}
function moveChunk(si,i,delta){const s=dragState(2);s[si]=swap(s[si],i,i+delta);dragSave(2,s);renderDrag(2)}
function setCategory(id,c){const s=dragState(1);if(c)s[id]=c;else delete s[id];dragSave(1,s);renderDrag(1)}
function tileStart(event,kind,a,b){pickedTile={kind,a,b};event.dataTransfer.setData('text/plain','tile');event.dataTransfer.effectAllowed='move'}
function tileDrop(event,kind,a,b){event.preventDefault();if(!pickedTile||pickedTile.kind!==kind)return;if(kind===0){const s=dragState(0);const [x]=s.splice(pickedTile.a,1);s.splice(a,0,x);dragSave(0,s)}else if(kind===2&&pickedTile.a===a){const s=dragState(2);const [x]=s[a].splice(pickedTile.b,1);s[a].splice(b,0,x);dragSave(2,s)}renderDrag(kind)}
function categoryDrop(event,c){event.preventDefault();if(pickedTile?.kind===1)setCategory(pickedTile.a,c)}
function checkDrag(kind){const s=dragState(kind),items=dragItems(kind);let score,total;if(kind===0){total=items.length;score=s.filter((id,i)=>id===i).length}else if(kind===1){total=items.length;score=items.filter(x=>s[x.id]===x.category).length}else{total=items.length;score=items.filter((x,i)=>s[i].every((id,pos)=>id===pos)).length}const el=$('drag-feedback');el.innerHTML=`<span class="${score===total?'correct':'wrong'}">${score}/${total} correct.</span> ${score===total?'Well done! You can move to the next activity.':'Try rearranging the cards and check again.'}`}
function resetDrag(kind){save('drag'+kind,null);renderDrag(kind)}

init();
